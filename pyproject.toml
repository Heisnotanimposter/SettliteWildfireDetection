[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire_detection"
version = "0.2.0"
description = "Satellite Wildfire Detection, Segmentation, and Classification Suite"
readme = "README.md"
authors = [
    { name = "Satellite Wildfire Detection Team" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "opencv-python>=4.5.0",
    "pyyaml>=5.4.0",
    "joblib>=1.0.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.4.0",
    "kagglehub>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "rasterio>=1.2.0"
]

[tool.setuptools.packages.find]
where = ["src"]
